
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Biến động cổ phiếu</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; background: black; color: white;
            font-family: Arial; text-align: center; padding: 15px;
        }
        .container { max-width: 1000px; margin: auto; }
        h1 { margin: 10px 0; }
        p { color: #aaa; }

        .stats {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 12px; margin: 20px 0;
        }
        .box {
            background: #171b22; border-radius: 10px;
            padding: 15px;
        }
        .box small { color: #aaa; }
        .box h2 { margin: 10px 0 0; font-size: 22px; }

        .video-box {
            background: #171b22; border-radius: 12px;
            padding: 15px;
        }
        video { width: 100%; max-height: 55vh; }

        @media (max-width: 600px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Biến động cổ phiếu</h1>
        <p>Mô phỏng và thống kê giá cổ phiếu</p>

        <div class="stats">
            <div class="box">
                <small>Giá trung bình</small>
                <h2>{{mean}} VND</h2>
            </div>
            <div class="box">
                <small>Giá cao nhất</small>
                <h2 style="color:#22c55e">{{high}} VND</h2>
            </div>
            <div class="box">
                <small>Giá thấp nhất</small>
                <h2 style="color:#ff5252">{{low}} VND</h2>
            </div>
            <div class="box">
                <small>Biên độ giá</small>
                <h2 style="color:#facc15">{{range}} VND</h2>
            </div>
        </div>

        <div class="video-box">
            <video controls autoplay muted playsinline>
                <source src="/video" type="video/mp4">
            </video>
        </div>
    </div>
</body>
</html>
